name: CI Build & Test

on:
  push:
    branches:
      - main
      - codex
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build & Test (Windows .NET 10)
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          global-json-file: TBDMovies_WinUI3/global.json

      - name: Resolve WinUI AppxMSBuildToolsPath via vswhere
        shell: pwsh
        run: |
          $testRoot = Join-Path $env:RUNNER_TEMP "tbd_ci_data"
          New-Item -ItemType Directory -Force -Path $testRoot | Out-Null
          "TBDMOVIES_TEST_DATA_ROOT=$testRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            $installPath = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
            if ($installPath) {
              $appxCandidates = Get-ChildItem -Path (Join-Path $installPath "MSBuild\Microsoft\VisualStudio") -Filter "AppxPackage" -Directory -Recurse -ErrorAction SilentlyContinue |
                Sort-Object FullName -Descending
              if ($appxCandidates) {
                $appxPath = $appxCandidates[0].FullName.TrimEnd('\') + '\'
                Write-Host "Resolved AppxMSBuildToolsPath: $appxPath"
                "AppxMSBuildToolsPath=$appxPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              }
            }
          }

      - name: Restore solution dependencies
        run: dotnet restore TBDMovies_WinUI3/TBDMovies.slnx

      - name: Build solution (Release)
        run: dotnet build TBDMovies_WinUI3/TBDMovies.slnx --no-restore -c Release

      - name: Run full test suite (Release)
        run: dotnet test TBDMovies_WinUI3/tests/TBDMovies.Tests/TBDMovies.Tests.csproj --no-build -c Release --logger "trx;LogFileName=test-results.trx"

      - name: Build WinUI desktop payload (Release win-x64)
        run: |
          dotnet restore TBDMovies_WinUI3/src/TBDMovies.UI/TBDMovies.UI.csproj -p:Platform=x64 -r win-x64
          dotnet build TBDMovies_WinUI3/src/TBDMovies.UI/TBDMovies.UI.csproj --no-restore -c Release -p:Platform=x64 -r win-x64

      - name: Upload TRX test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows
          path: '**/TestResults/test-results.trx'
          if-no-files-found: ignore
